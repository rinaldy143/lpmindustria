name: Deploy WordPress via SFTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server via SFTP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 21
          source: "./*,!.git,!.github,!wp-content/uploads,!wp-content/cache,!node_modules,!vendor,!.env,!.htaccess"
          target: "/htdocs/lpmindustria"
          strip_components: 1
          rm: true
