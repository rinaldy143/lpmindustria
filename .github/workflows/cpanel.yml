name: Deploy WordPress via SFTP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.1.2
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: "/home/lpmindu1/public_html/lpmindustria/"
          exclude: |
            .git/
            .github/
            wp-content/uploads/
            wp-content/cache/
            node_modules/
            vendor/
            .env
            .htaccess
          dangerous-clean-slate: true
          log-level: verbose
          timeout: 300000
